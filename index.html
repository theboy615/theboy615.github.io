<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dastgir TV 3D - Final</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#0f1a2e,#04060a);color:#fff;font-family:system-ui;padding-bottom:90px}
header{position:sticky;top:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(20px);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(0,245,255,0.3);z-index:100}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px}
.logo img{width:48px;height:48px;border-radius:50%;border:2px solid #00f5ff;box-shadow:0 0 18px #00f5ff;background:#000;object-fit:cover}
.logo span{color:#00f5ff;text-shadow:0 0 10px #00f5ff}
.tabs{display:flex;gap:6px}
.tab{padding:7px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#fff;cursor:pointer;font-size:11px;font-weight:800}
.tab.active{background:linear-gradient(145deg,#00f5ff,#0088ff);color:#000;box-shadow:0 0 15px #00f5ff}
.video-wrap{background:#000} video{width:100%;aspect-ratio:16/9;display:block;background:#000}
.dvr-bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:linear-gradient(145deg,#111a2e,#0a0f1e);border-bottom:1px solid rgba(0,245,255,0.2);align-items:center}
.dvr-bar .label{font-size:11px;font-weight:800;color:#00f5ff}
.dvr-btn{padding:6px 10px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#fff;cursor:pointer;font-size:11px;font-weight:700}
.dvr-btn.live{background:linear-gradient(145deg,#ff1744,#b71c1c);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 5px #ff1744}50%{box-shadow:0 0 15px #ff1744}}
.controls{display:flex;flex-wrap:wrap;gap:7px;padding:10px;background:#0e0e0e;border-bottom:1px solid #222}
.cbtn{padding:7px 12px;border-radius:12px;border:1px solid #333;background:#1e1e1e;color:#fff;cursor:pointer;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px}
.cbtn.rec{background:linear-gradient(145deg,#ff1744,#b71c1c)} .cbtn.hd.active{background:linear-gradient(145deg,#00f5ff,#0066ff);color:#000}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:18px 10px}
.card{background:transparent;border:none;padding:6px;text-align:center;cursor:pointer;transition:0.35s}
.card:hover{transform:translateY(-6px) scale(1.06)}
.icon-bubble{width:78px;height:78px;margin:0 auto;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.4) 30%, rgba(180,220,255,0.2) 70%, rgba(0,150,255,0.15));border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 5px 10px rgba(255,255,255,1),inset 0 -5px 10px rgba(0,0,0,0.25),0 8px 20px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.6);border:2px solid rgba(255,255,255,0.8)}
.icon-bubble img{width:54px;height:54px;object-fit:contain;border-radius:50%;background:#fff;padding:4px}
.card p{font-size:10px;margin:8px 0 0;font-weight:800}
.boxes{padding:10px 12px}
.box{background:linear-gradient(145deg,#1e1e1e,#111);border:1px solid #2a2a2a;border-radius:16px;padding:14px}
.box input,.box select{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:1px solid #333;background:#0a0a0a;color:#fff;font-size:12px}
.box button{width:100%;padding:10px;border-radius:10px;border:none;background:linear-gradient(145deg,#00f5ff,#0077ff);color:#000;font-weight:900;margin-top:6px;cursor:pointer}
.wa-float-gol{position:fixed;bottom:20px;right:16px;z-index:90;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #6bff8d, #25D366 30%, #128C7E 70%);display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:inset 0 4px 8px rgba(255,255,255,0.9),0 8px 20px rgba(37,211,102,0.5),0 0 0 2px rgba(255,255,255,0.8);border:2px solid #fff;animation:waPulse 2s infinite}
.wa-float-gol i{font-size:34px;color:#fff}
@keyframes waPulse{0%{box-shadow:0 8px 20px rgba(37,211,102,0.5),0 0 0 0 rgba(37,211,102,0.7)}70%{box-shadow:0 8px 20px rgba(37,211,102,0.5),0 0 0 12px rgba(37,211,102,0)}100%{box-shadow:0 8px 20px rgba(37,211,102,0.5),0 0 0 0 rgba(37,211,102,0)}}

/* LOCK SCREEN - NEW 3D LOGO + 2 CRYSTAL BUTTONS */
#lockScreen{position:fixed;inset:0;z-index:99999;background:radial-gradient(ellipse at center,#0d1730,#02040a);display:flex;align-items:center;justify-content:center;padding:18px}
.lock-box{background:linear-gradient(145deg,rgba(20,30,55,0.96),rgba(8,12,25,0.98));backdrop-filter:blur(30px);border:1px solid rgba(0,245,255,0.25);border-radius:32px;padding:26px 18px;width:100%;max-width:380px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,0.9),0 0 50px rgba(0,245,255,0.15)}
.lock-3d-img{width:130px;height:130px;margin:0 auto 12px;border-radius:50%;border:3px solid #00f5ff;box-shadow:0 0 35px #00f5ff, inset 0 4px 12px rgba(255,255,255,0.8);object-fit:cover;background:#000;display:block}
.lock-box h2{margin:8px 0 4px;font-size:20px;font-weight:900} .lock-box h2 span{color:#00f5ff;text-shadow:0 0 15px #00f5ff}
.lock-box .sub{font-size:11px;opacity:0.7;margin-bottom:16px;line-height:1.5}
.crystal-btn{width:100%;padding:14px 16px;border-radius:22px;border:1px solid rgba(255,255,255,0.25);font-weight:900;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;transition:0.35s;position:relative;overflow:hidden}
.crystal-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(to bottom, rgba(255,255,255,0.35), transparent);border-radius:22px 22px 0 0}
.crystal-btn.join{background:linear-gradient(145deg, rgba(37,211,102,0.9), rgba(18,140,126,0.9));color:#fff;box-shadow:inset 0 2px 8px rgba(255,255,255,0.6), 0 8px 25px rgba(37,211,102,0.4)}
.crystal-btn.verify{background:linear-gradient(145deg, rgba(80,80,80,0.6), rgba(30,30,30,0.8));color:#777;cursor:not-allowed}
.crystal-btn.verify.active{background:linear-gradient(145deg, #00f5ff, #0077ff);color:#000;cursor:pointer;box-shadow:inset 0 2px 8px rgba(255,255,255,0.8), 0 8px 25px rgba(0,245,255,0.5);border-color:#00f5ff}
.timer{font-size:11px;color:#ffcc00;height:16px;margin-top:4px}
</style>
</head>
<body>

<div id="lockScreen">
<div class="lock-box">
<img class="lock-3d-img" src="icon.png" onerror="this.src='https://via.placeholder.com/130?text=TV'">
<h2>Dastgir <span>TV 3D</span></h2>
<div class="sub">ماشاءاللہ! TV دیکھنے کے لیے نیچے 2 steps کریں</div>
<button class="crystal-btn join" onclick="joinChannel()"><i class='bx bxl-whatsapp'></i> Join My WhatsApp Channel</button>
<button class="crystal-btn verify" id="btnVerify" onclick="verifyJoin()"><i class='bx bx-badge-check'></i> Verification - Unlock TV</button>
<div class="timer" id="timer">پہلے Join Channel دبائیں</div>
<div style="font-size:10px;opacity:0.4;margin-top:10px">https://whatsapp.com/channel/0029VbE16QE0lwgwVV0vR91i</div>
</div>
</div>

<header>
<div class="logo"><img src="icon.png"><span>Dastgir TV 3D</span></div>
<div class="tabs">
<button class="tab active" onclick="filterNet('all',this)">All</button>
<button class="tab" onclick="filterNet('jazz_tv',this)">Jazz</button>
<button class="tab" onclick="filterNet('zong_tv',this)">Zong</button>
</div>
</header>

<div class="video-wrap"><video id="player" controls autoplay playsinline></video></div>

<div class="dvr-bar">
<span class="label"><i class='bx bx-time-five'></i> Timeshift:</span>
<button class="dvr-btn" onclick="seekBack(30)">-30s</button>
<button class="dvr-btn" onclick="seekBack(60)">-1m</button>
<button class="dvr-btn" onclick="seekBack(300)">-5m</button>
<button class="dvr-btn" onclick="seekBack(1800)">-30m</button>
<button class="dvr-btn live" onclick="goLive()">LIVE</button>
<span id="dvrInfo" style="font-size:10px;color:#aaa;margin-left:auto"></span>
</div>

<div class="controls">
<button class="cbtn" onclick="doPiP()"><i class='bx bx-fullscreen'></i> PiP</button>
<button class="cbtn rec" id="btnMP4" onclick="toggleRec('mp4')"><i class='bx bxs-videos'></i> MP4</button>
<button class="cbtn rec" id="btnMP3" onclick="toggleRec('mp3')" style="background:linear-gradient(145deg,#9c27b0,#673ab7)"><i class='bx bxs-music'></i> MP3</button>
<button class="cbtn hd active" id="btnHD" onclick="toggleQuality()"><i class='bx bx-hd'></i> HD</button>
<button class="cbtn" onclick="stopAll()"><i class='bx bx-stop'></i> Stop</button>
<button class="cbtn" onclick="openMx()"><i class='bx bx-play'></i> MX</button>
<span id="nowName"><span id="chName">HUM TV HD</span> <span id="recTimer"></span></span>
</div>

<div class="grid" id="grid"></div>

<div class="boxes">
<div class="box">
<h3><i class='bx bx-plus-circle'></i> Channel Add Box</h3>
<input id="addName" placeholder="Channel Name">
<input id="addLogo" placeholder="Logo URL">
<input id="addUrl" placeholder="m3u8 URL">
<select id="addNet"><option value="jazz_tv">Jazz TV</option><option value="zong_tv" selected>Zong TV</option></select>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button onclick="addChannel()">Add +</button><button style="background:linear-gradient(145deg,#ff9800,#ff5722)" onclick="clearForm()">Clear</button></div>
</div>
</div>

<a class="wa-float-gol" href="https://whatsapp.com/channel/0029VbE16QE0lwgwVV0vR91i" target="_blank"><i class='bx bxl-whatsapp'></i></a>

<script>
const CHANNEL_LINK="https://whatsapp.com/channel/0029VbE16QE0lwgwVV0vR91i";
let joinClicked=localStorage.getItem('dastgir_join_clicked')==='true';
let verified=localStorage.getItem('dastgir_verified')==='true';
function checkLock(){ if(verified){ document.getElementById('lockScreen').style.display='none'; return; } document.getElementById('lockScreen').style.display='flex'; if(joinClicked) enableVerifyCountdown(); }
function joinChannel(){ window.open(CHANNEL_LINK,'_blank'); joinClicked=true; localStorage.setItem('dastgir_join_clicked','true'); enableVerifyCountdown(); }
function enableVerifyCountdown(){ let sec=5; const btnV=document.getElementById('btnVerify'); const timer=document.getElementById('timer'); btnV.classList.remove('active'); timer.innerText=`Wait ${sec}s...`; let intv=setInterval(()=>{ sec--; if(sec>0) timer.innerText=`Wait ${sec}s...`; else { clearInterval(intv); timer.innerText="✅ Ab Verification dabayen"; btnV.classList.add('active'); } },1000); }
function verifyJoin(){ const btnV=document.getElementById('btnVerify'); if(!btnV.classList.contains('active')){ alert('Pehle Join Channel dabayen'); return; } localStorage.setItem('dastgir_verified','true'); document.getElementById('lockScreen').style.display='none'; }
checkLock();

let channels=[
  { name: "HUM TV HD", logo: "https://canvas.tamashaweb.com/jazzlive/uploads/channels/logo/HUM-TV-Channel-logo.webp?id=30", url: "https://cdn12isb.tamashaweb.com:8087/YlUHeDQb7a/humTV-abr/live/82H/chunks.m3u8", network: "jazz_tv" },
  { name: "Madani Channel", logo: "https://canvas.tamashaweb.com/jazzlive/uploads/channels/logo/madani-channel-live.webp?id=59", url: "https://cdn12isb.tamashaweb.com:8087/YlUHeDQb7a/Madni-abr/live/vsat-94M/chunks.m3u8", network: "jazz_tv" },
  { name: "Geo Entertainment", logo: "https://canvas.tamashaweb.com/jazzlive/uploads/channels/logo/geo-entertainment-live.webp?id=98", url: "https://cdn12isb.tamashaweb.com:8087/YlUHeDQb7a/GeoEntertainment-abr/live/122M/chunks.m3u8", network: "jazz_tv" },
  { name: "Green Entertainment", logo: "https://canvas.tamashaweb.com/jazzlive/uploads/channels/1702552123-logo.webp?id=17", url: "https://cdn12isb.tamashaweb.com:8087/YlUHeDQb7a/Green_Entertainment-abr/live/vsat-green-M/chunks.m3u8", network: "jazz_tv" },
  { name: "ARY Digital", logo: "https://canvas.tamashaweb.com/jazzlive/uploads/channels/logo/ary-digital-live-logo.webp?id=51", url: "https://cdn12isb.tamashaweb.com:8087/YlUHeDQb7a/ARYdigital-abr/live/vsat-ary-H/chunks.m3u8", network: "jazz_tv" },
  { name: "ARY Zindagi", logo: "https://canvas.tamashaweb.com/jazzlive/uploads/channels/logo/ary-zindagi-live-logo.webp?id=58", url: "https://cdn12isb.tamashaweb.com:8087/YlUHeDQb7a/ARYzindagi-abr/live/vsat-aryzindagi-H/chunks.m3u8", network: "jazz_tv" },
  { name: "HUM Sitaray", logo: "https://canvas.tamashaweb.com/jazzlive/uploads/channels/logo/HUM-Sitaray-Channel-logo.webp?id=27", url: "https://cdn12isb.tamashaweb.com:8087/YlUHeDQb7a/HumSitaray-abr/live/vsat-107H/chunks.m3u8", network: "jazz_tv" },
  { name: "ARY News", logo: "https://canvas.tamashaweb.com/jazzlive/uploads/channels/1684242189-logo.webp?id=58", url: "https://cdn12isb.tamashaweb.com:8087/YlUHeDQb7a/ARYnews-abr/live/vsat-arynews-H/chunks.m3u8", network: "jazz_tv" },
  { name: "Cartoon Network", logo: "https://images.mjunoon.tv:8181/logo/cartoon-network-logo-mjunoon.webp", url: "https://vodzong.mjunoon.tv:8087/web/cartoon-network-87/live/87H/chunks.m3u8", network: "zong_tv" }
];
let currentNet='all', hls, currentUrl='', isHD=true, recorder=null, recChunks=[], timerInt=null, recStart=0;
const grid=document.getElementById('grid'), player=document.getElementById('player');
function render(){ grid.innerHTML=''; channels.filter(c=>currentNet==='all'||c.network===currentNet).forEach(ch=>{ let d=document.createElement('div'); d.className='card'; d.innerHTML=`<div class="icon-bubble"><img src="${ch.logo}"></div><p>${ch.name}</p>`; d.onclick=()=>play(ch.url,ch.name); grid.appendChild(d); }); }
function play(url,name){ currentUrl=url; chName.innerText=name; if(Hls.isSupported()){ if(hls) hls.destroy(); hls=new Hls({liveDurationInfinity:true}); hls.loadSource(url); hls.attachMedia(player); hls.on(Hls.Events.MANIFEST_PARSED,()=>{player.play();}); } else { player.src=url; player.play(); } }
function filterNet(t,b){ currentNet=t; document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); b.classList.add('active'); render(); }
function openMx(){ if(!currentUrl) return alert('Channel play karo'); location.href='intent:'+currentUrl+'#Intent;package=com.mxtech.videoplayer.ad;end'; }
async function doPiP(){ try{ if(document.pictureInPictureElement) await document.exitPictureInPicture(); else await player.requestPictureInPicture(); }catch(e){} }
function seekBack(s){ try{ if(player.seekable.length>0){ let end=player.seekable.end(0); player.currentTime=Math.max(player.seekable.start(0), end-s-5); } else player.currentTime=Math.max(0, player.currentTime-s); }catch(e){} }
function goLive(){ try{ if(player.seekable.length>0) player.currentTime=player.seekable.end(0); }catch(e){} }
function toggleRec(t){ if(recorder && recorder.state==='recording'){ recorder.stop(); return; } try{ const stream=player.captureStream(); recChunks=[]; let mime=t==='mp3'?'audio/webm':'video/webm'; recorder=new MediaRecorder(stream,{mimeType:mime}); recorder.ondataavailable=e=>{if(e.data.size>0) recChunks.push(e.data)}; recorder.onstop=()=>{ clearInterval(timerInt); recTimer.innerText=''; const blob=new Blob(recChunks,{type:mime}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Dastgir-${chName.innerText}-${Date.now()}.webm`; a.click(); }; recorder.start(200); recStart=Date.now(); timerInt=setInterval(()=>{ let sec=Math.floor((Date.now()-recStart)/1000); recTimer.innerText=`● REC ${sec}s`; },1000); }catch(e){alert(e.message)} }
function stopAll(){ if(recorder) recorder.stop(); player.pause(); }
function toggleQuality(){ isHD=!isHD; btnHD.classList.toggle('active',isHD); if(hls) hls.currentLevel=isHD?-1:0; }
function addChannel(){ const n=addName.value.trim(), l=addLogo.value.trim(), u=addUrl.value.trim(), net=addNet.value; if(!n||!l||!u) return alert('Fill all'); channels.push({name:n,logo:l,url:u.split('?')[0],network:net}); render(); clearForm(); }
function clearForm(){ addName.value=''; addLogo.value=''; addUrl.value=''; }
render(); play(channels[0].url, channels[0].name);
</script>
</body>
</html>
