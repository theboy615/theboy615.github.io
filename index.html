<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dastgir TV 3D - Live TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial}
.header{background:linear-gradient(90deg,#ff0000,#8b0000);padding:15px;display:flex;align-items:center;gap:12px;justify-content:center}
.header img{width:55px;height:55px;border-radius:12px}
.header h1{font-size:22px}
.tabs{display:flex;gap:8px;justify-content:center;padding:12px;background:#111}
.tab{padding:8px 22px;background:#222;border-radius:20px;cursor:pointer;border:1px solid #333}
.tab.active{background:red;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:15px}
.card{background:#1a1a1a;border-radius:12px;overflow:hidden;border:1px solid #333;cursor:pointer;text-align:center}
.card img{width:100%;height:90px;object-fit:cover;background:#222}
.card div{padding:10px;font-weight:bold;font-size:14px}
.player{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:100;flex-direction:column}
.video{flex:1;width:100%;background:#000}
.close{padding:14px;background:red;color:#fff;border:none;font-size:18px;font-weight:bold}
.lock{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:200;display:flex;align-items:center;justify-content:center}
.lock-box{background:#111;padding:25px;border-radius:15px;text-align:center;border:2px solid red;max-width:320px}
.lock-box a{display:block;background:#25D366;color:#fff;padding:12px;border-radius:25px;text-decoration:none;margin-top:15px;font-weight:bold}
.wa{position:fixed;bottom:20px;right:20px;background:#25D366;width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;z-index:50;text-decoration:none}
</style>
</head>
<body>

<div class="header">
<img src="https://i.imgur.com/8Km9tLL.png" id="icon">
<h1>DASTGIR TV 3D</h1>
</div>

<div class="tabs">
<div class="tab active" onclick="filterCh('all',this)">All</div>
<div class="tab" onclick="filterCh('jazz',this)">Jazz</div>
<div class="tab" onclick="filterCh('zong',this)">Zong</div>
</div>

<div class="grid" id="grid"></div>

<div class="player" id="player">
<button class="close" onclick="closeP()">✕ CLOSE PLAYER</button>
<video class="video" id="video" controls autoplay></video>
</div>

<div class="lock" id="lock">
<div class="lock-box">
<h2>🔒 Verification Required</h2>
<p style="margin:12px 0;color:#aaa">WhatsApp Channel Follow karke verification karo</p>
<a href="https://whatsapp.com/channel/0029Vb6K1vG2UPB5rW5aR03j" target="_blank" onclick="unlock()">📲 Follow WhatsApp Channel</a>
<button onclick="unlock()" style="margin-top:12px;background:#222;color:#fff;border:1px solid #444;padding:8px 20px;border-radius:20px">Already Followed - Unlock</button>
</div>
</div>

<a class="wa" href="https://whatsapp.com/channel/0029Vb6K1vG2UPB5rW5aR03j" target="_blank">💬</a>

<script>
const channels=[
{name:"PTV Sports",logo:"https://i.imgur.com/8Km9tLL.png",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",type:"all"},
{name:"Geo News",logo:"https://i.imgur.com/QkBkIyM.png",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",type:"all"},
{name:"ARY News",logo:"https://i.imgur.com/8Km9tLL.png",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",type:"jazz"},
{name:"Ten Sports",logo:"https://i.imgur.com/QkBkIyM.png",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",type:"zong"},
{name:"Hum TV",logo:"https://i.imgur.com/8Km9tLL.png",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",type:"jazz"},
{name:"A Sports",logo:"https://i.imgur.com/QkBkIyM.png",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",type:"zong"},
{name:"PTV Home",logo:"https://i.imgur.com/8Km9tLL.png",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",type:"all"},
{name:"Geo Kahani",logo:"https://i.imgur.com/QkBkIyM.png",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",type:"jazz"},
{name:"ARY Digital",logo:"https://i.imgur.com/8Km9tLL.png",url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",type:"zong"}
];
const grid=document.getElementById('grid');
function render(f='all'){
grid.innerHTML='';
channels.filter(c=>f==='all'||c.type===f).forEach(ch=>{
grid.innerHTML+=`<div class="card" onclick="play('${ch.url}')"><img src="${ch.logo}"><div>${ch.name}</div></div>`
});
}
function play(u){document.getElementById('player').style.display='flex';document.getElementById('video').src=u}
function closeP(){document.getElementById('player').style.display='none';document.getElementById('video').pause()}
function filterCh(t,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');render(t)}
function unlock(){document.getElementById('lock').style.display='none';localStorage.setItem('dastgir_verified','yes')}
if(localStorage.getItem('dastgir_verified')){document.getElementById('lock').style.display='none'}
render();
</script>
</body>
</html>
